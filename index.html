<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Presupuesto Público - CIAF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ciaf-blue: #1565C0;
            --ciaf-green: #2E7D32;
        }
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        /* Dimensiones fijas solicitadas */
        .card-container {
            width: 330px;
            height: 450px;
            perspective: 1000px;
        }
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flashcard-inner.is-flipped {
            transform: rotateY(180deg);
        }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border-radius: 1.25rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            color: #1e293b;
        }
        /* Paleta de colores pasteles con texto oscuro */
        .color-0 { background-color: #e0f2fe; color: #0369a1; border: 2px solid #bae6fd; } /* Azul pastel */
        .color-1 { background-color: #f0fdf4; color: #15803d; border: 2px solid #dcfce7; } /* Verde pastel */
        .color-2 { background-color: #fffbeb; color: #a16207; border: 2px solid #fef3c7; } /* Ambar pastel */
        .color-3 { background-color: #faf5ff; color: #7e22ce; border: 2px solid #f3e8ff; } /* Violeta pastel */
        .color-4 { background-color: #fff1f2; color: #be123c; border: 2px solid #ffe4e6; } /* Rosa pastel */

        .ciaf-header {
            background-color: var(--ciaf-blue);
            border-bottom: 4px solid var(--ciaf-green);
        }
        
        /* Animación suave de cambio de tarjeta */
        .fade-in {
            animation: fadeIn 0.3s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Encabezado Institucional -->
    <header class="ciaf-header text-white p-4 text-center shadow-md">
        <h1 class="text-xl font-bold uppercase tracking-tight">Simulador CIAF</h1>
        <p class="text-xs opacity-90">Tecnología en Contabilidad</p>
    </header>

    <main class="flex-grow flex flex-col items-center justify-start pt-6 px-4">
        
        <!-- Indicador de Progreso -->
        <div class="mb-6 w-full max-w-[330px]">
            <div class="flex justify-between items-end mb-1">
                <span id="progress-text" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Tarjeta 1 de 32</span>
                <span id="percentage-text" class="text-[10px] font-bold text-blue-600">0%</span>
            </div>
            <div class="w-full h-1.5 bg-gray-200 rounded-full">
                <div id="progress-bar" class="h-full bg-blue-600 rounded-full transition-all duration-500" style="width: 3%"></div>
            </div>
        </div>

        <!-- Área de la Tarjeta (Dimensiones Fijas) -->
        <div class="card-container fade-in" id="card-anchor">
            <div class="flashcard-inner" id="current-card">
                <!-- El contenido se genera por JS -->
            </div>
        </div>

        <!-- Navegación debajo de la tarjeta -->
        <div class="mt-8 flex flex-col items-center gap-4 w-full max-w-[330px]">
            <div class="flex items-center justify-between w-full">
                <button id="prev-btn" class="flex items-center justify-center w-12 h-12 bg-white border border-gray-200 rounded-full shadow-sm text-blue-600 disabled:opacity-20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>

                <button id="flip-action-btn" class="flex-grow mx-4 py-3 bg-blue-700 text-white font-bold rounded-xl shadow-lg uppercase text-xs tracking-widest active:scale-95 transition-transform">
                    Girar Tarjeta
                </button>

                <button id="next-btn" class="flex items-center justify-center w-12 h-12 bg-white border border-gray-200 rounded-full shadow-sm text-blue-600 disabled:opacity-20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
            
            <p class="text-[10px] text-gray-400 font-medium uppercase tracking-tighter">Toca la tarjeta o usa los botones para navegar</p>
        </div>

    </main>

    <footer class="text-center py-4 bg-white border-t border-gray-100">
        <p class="text-[9px] text-gray-400 uppercase font-bold tracking-widest">© 2026 Institución CIAF | Educación para el Futuro</p>
    </footer>

    <script>
        const flashcardsData = [
            { front: "ICLD", back: "Ingresos Corrientes de Libre Destinación: Recursos propios (impuestos) que el municipio usa con autonomía para funcionamiento e inversión." },
            { front: "Código CCPET 1.1.01.01.001", back: "Identificador del Impuesto Predial Unificado dentro del catálogo de ingresos tributarios locales." },
            { front: "Etapa de Programación", back: "Fase del ciclo donde se calculan las proyecciones de ingresos y gastos basadas en IPC y PIB." },
            { front: "Ley 617 de 2000", back: "Establece límites a los gastos de funcionamiento basados en los ICLD para garantizar la viabilidad fiscal." },
            { front: "Destinación Específica", back: "Recursos que por ley nacen con un fin único. No pueden usarse para gastos diferentes (Ej: Estampillas)." },
            { front: "SGP (Sistema General de Participaciones)", back: "Transferencias de la Nación para Salud, Educación, Agua Potable, Deporte, Cultura, Primera Infancia y Propósito General, entre otros." },
            { front: "Decreto de Liquidación", back: "Acto administrativo del Alcalde que desglosa detalladamente el presupuesto aprobado por el Concejo." },
            { front: "Dígito inicial '1' (CCPET)", back: "Identifica los INGRESOS: Representa la entrada de recursos a la tesorería municipal." },
            { front: "Dígito inicial '2' (CCPET)", back: "Identifica los GASTOS: Incluye Funcionamiento e Inversión pública." },
            { front: "Dígito inicial '3' (CCPET)", back: "Identifica el SERVICIO DE LA DEUDA: Pago de capital e intereses de créditos bancarios." },
            { front: "Gasto de Funcionamiento", back: "Apropiaciones para la operatividad administrativa: Nómina, servicios públicos y papelería general." },
            { front: "Gasto de Inversión", back: "Recursos destinados a proyectos sociales e infraestructura para el bienestar de la comunidad." },
            { front: "Plan de Desarrollo Municipal", back: "Hoja de ruta cuatrienal que justifica legalmente cada inversión incluida en el presupuesto." },
            { front: "Equilibrio Presupuestal", back: "Principio legal: El total de Ingresos (1) debe ser igual a la suma de Gastos (2) y Deuda (3)." },
            { front: "IPC (Inflación)", back: "Variable macroeconómica usada para ajustar el valor del presupuesto y mantener el poder adquisitivo." },
            { front: "Fuente ICLD (1.2.1.0.00)", back: "Bolsillo de recursos propios. Es el único que permite financiar la nómina administrativa del municipio." },
            { front: "Uso del SGP Educación", back: "Financiar el servicio educativo público, pago de docentes y mantenimiento de infraestructuras escolares." },
            { front: "Uso de las Estampillas", back: "Financiar sectores específicos con etiquetas sociales como Cultura, Adulto Mayor o Deporte." },
            { front: "Concepto de TASAS", back: "Pagos por servicios específicos recibidos (ej. Tasa Pro-Deporte) destinados a fomentar esa misma actividad." },
            { front: "Recursos de Capital", back: "Ingresos extraordinarios: Créditos, rendimientos financieros, excedentes o venta de activos estatales." },
            { front: "Apropiación", back: "Autorización máxima legal otorgada por el Concejo para gastar en un rubro específico durante la vigencia." },
            { front: "Vigencia Fiscal", back: "Año presupuestal: Del 1 de enero al 31 de diciembre en el territorio colombiano." },
            { front: "Estatuto Orgánico", back: "Norma superior que dicta las reglas para programar, aprobar y ejecutar el presupuesto público." },
            { front: "POAI", back: "Plan Operativo Anual de Inversiones: Instrumento que vincula los proyectos del Plan de Desarrollo con el presupuesto." },
            { front: "MFMP", back: "Marco Fiscal de Mediano Plazo: Proyecciones a 10 años para asegurar la sostenibilidad de las finanzas locales." },
            { front: "Sobretasa a la Gasolina", back: "Renta con destino fijo legal exclusivo para mantenimiento vial y sistemas de transporte masivo." },
            { front: "Pasivos Prestacionales", back: "Reserva de dinero obligatoria para garantizar el pago de pensiones y cesantías de los funcionarios." },
            { front: "Cadena Presupuestal", back: "Pasos operativos del gasto: 1. Solicitud CDP -> 2. Expedición CDP -> 3. Registro (RP) -> 4. Obligación -> 5. Orden de Pago." },
            { front: "Diferencia Rubro vs Fuente", back: "El Rubro es el origen/nombre (Ej: Predial); la Fuente es el permiso legal de uso (Ej: ICLD)." },
            { front: "Uso de la Cuenta 3 (Deuda)", back: "Exclusivamente para honrar obligaciones financieras contraídas en vigencias anteriores (Capital + Interés)." },
            { front: "Ciclo Presupuestal (3 Pasos)", back: "1. Planeación (Proyección/Aprobación) -> 2. Ejecución (Recaudo/Gasto) -> 3. Cierre (Evaluación/Liquidación)." },
            { front: "CDP vs RP", back: "El CDP garantiza disponibilidad de saldo; el RP perfecciona el compromiso legal (ej. firma de contrato)." }
        ];

        let currentIndex = 0;
        const total = flashcardsData.length;
        const cardInner = document.getElementById('current-card');
        const progressText = document.getElementById('progress-text');
        const percentageText = document.getElementById('percentage-text');
        const progressBar = document.getElementById('progress-bar');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const flipBtn = document.getElementById('flip-action-btn');

        function updateCard() {
            const data = flashcardsData[currentIndex];
            const colorClass = `color-${currentIndex % 5}`;
            
            // Reiniciar estado visual
            cardInner.classList.remove('is-flipped');
            
            cardInner.innerHTML = `
                <div class="flashcard-front ${colorClass}">
                    <span class="text-[10px] font-black uppercase opacity-40 mb-6 tracking-[0.2em]">Pregunta</span>
                    <p class="font-bold text-lg leading-tight px-2">${data.front}</p>
                </div>
                <div class="flashcard-back">
                    <span class="text-[10px] font-black uppercase text-gray-300 mb-6 tracking-[0.2em]">Respuesta Técnica</span>
                    <p class="text-sm font-medium leading-relaxed">${data.back}</p>
                </div>
            `;

            // Actualizar progreso
            progressText.innerText = `Tarjeta ${currentIndex + 1} de ${total}`;
            const percent = Math.round(((currentIndex + 1) / total) * 100);
            percentageText.innerText = `${percent}%`;
            progressBar.style.width = `${percent}%`;

            // Estados de botones
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === total - 1;
        }

        function flipCard() {
            cardInner.classList.toggle('is-flipped');
        }

        // Event Listeners
        cardInner.addEventListener('click', flipCard);
        flipBtn.addEventListener('click', flipCard);

        nextBtn.addEventListener('click', () => {
            if (currentIndex < total - 1) {
                currentIndex++;
                updateCard();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        // Soporte teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
            if (e.key === ' ') { e.preventDefault(); flipCard(); }
        });

        // Inicialización
        updateCard();
    </script>
</body>
</html>
