<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Presupuesto Público - CIAF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ciaf-blue: #1565C0;
            --ciaf-green: #2E7D32;
        }
        body {
            background-color: #f9fafb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overscroll-behavior: none;
        }
        .perspective {
            perspective: 1500px;
        }
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 400px;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flashcard-inner.is-flipped {
            transform: rotateY(180deg);
        }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background-color: #ffffff;
            border: 2px solid #e5e7eb;
        }
        .ciaf-header {
            background-color: var(--ciaf-blue);
            border-bottom: 4px solid var(--ciaf-green);
        }
        /* Colores pasteles dinámicos */
        .bg-pastel-1 { background-color: #E3F2FD; color: #0D47A1; border: 2px solid #BBDEFB; } /* Azul */
        .bg-pastel-2 { background-color: #F1F8E9; color: #1B5E20; border: 2px solid #DCEDC8; } /* Verde */
        .bg-pastel-3 { background-color: #FFFDE7; color: #F57F17; border: 2px solid #FFF9C4; } /* Amarillo */
        .bg-pastel-4 { background-color: #F3E5F5; color: #4A148C; border: 2px solid #E1BEE7; } /* Morado */
        .bg-pastel-5 { background-color: #FFF3E0; color: #E65100; border: 2px solid #FFE0B2; } /* Naranja */

        /* Animación de entrada */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-slide {
            animation: slideIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="ciaf-header text-white p-4 md:p-6 text-center shadow-md">
        <h1 class="text-xl md:text-2xl font-bold uppercase tracking-tight">Simulador de Estudio CIAF</h1>
        <p class="text-sm opacity-90">Tecnología en Contabilidad - Presupuesto Público</p>
    </header>

    <main class="flex-grow container mx-auto px-4 flex flex-col items-center justify-center py-6">
        
        <!-- Indicador de Progreso -->
        <div class="mb-6 text-center">
            <span id="progress-text" class="text-sm font-medium text-gray-500 uppercase tracking-widest">Cargando...</span>
            <div class="w-48 h-1.5 bg-gray-200 rounded-full mt-2 mx-auto">
                <div id="progress-bar" class="h-full bg-blue-600 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Contenedor de la Tarjeta -->
        <div class="w-full max-w-sm md:max-w-md perspective" id="card-wrapper">
            <!-- La tarjeta se inyecta aquí -->
        </div>

        <!-- Controles de Navegación -->
        <div class="mt-10 flex items-center gap-8">
            <button id="prev-btn" class="p-4 bg-white rounded-full shadow-lg text-blue-600 hover:bg-blue-50 disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="15 19l-7-7 7-7" />
                </svg>
            </button>

            <button id="flip-btn" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition-all uppercase text-sm tracking-wide">
                Ver Respuesta
            </button>

            <button id="next-btn" class="p-4 bg-white rounded-full shadow-lg text-blue-600 hover:bg-blue-50 disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="9 5l7 7-7 7" />
                </svg>
            </button>
        </div>

        <p class="mt-6 text-xs text-gray-400 italic">Toca la tarjeta para voltearla</p>

    </main>

    <footer class="text-center p-4 text-gray-400 text-[10px] uppercase border-t border-gray-100 bg-white">
        &copy; 2026 CIAF - Facultad de Ciencias Contables | Formación Profesional
    </footer>

    <script>
        const flashcardsData = [
            { front: "ICLD", back: "Ingresos Corrientes de Libre Destinación: Recursos propios (impuestos) que el municipio usa con autonomía para funcionamiento e inversión." },
            { front: "Código CCPET 1.1.01.01.001", back: "Identificador del Impuesto Predial Unificado dentro del catálogo de ingresos tributarios." },
            { front: "Etapa de Programación", back: "Fase inicial donde se calculan las proyecciones de ingresos y gastos basadas en el IPC y el PIB." },
            { front: "Ley 617 de 2000", back: "Norma que pone límites a los gastos de funcionamiento basados en los ICLD para evitar la quiebra de municipios." },
            { front: "Destinación Específica", back: "Dinero que por ley 'nace' con un fin único. Prohibido usarlo para fines diferentes (Ej: Estampillas)." },
            { front: "SGP (Sistema General de Participaciones)", back: "Transferencias de la Nación para sectores como Salud, Educación, Agua Potable, Deporte, Cultura, Primera Infancia y Propósito General, entre otros." },
            { front: "Decreto de Liquidación", back: "Documento oficial del Alcalde que desglosa y pone en marcha el presupuesto aprobado por el Concejo." },
            { front: "Dígito inicial '1' (CCPET)", back: "Identifica los INGRESOS: Representa toda la entrada de recursos a la tesorería." },
            { front: "Dígito inicial '2' (CCPET)", back: "Identifica los GASTOS: Incluye Funcionamiento e Inversión." },
            { front: "Dígito inicial '3' (CCPET)", back: "Identifica el SERVICIO DE LA DEUDA: Pagos de capital e intereses de préstamos bancarios." },
            { front: "Gasto de Funcionamiento", back: "Apropiaciones para la operatividad administrativa: Nómina, servicios públicos y papelería." },
            { front: "Gasto de Inversión", back: "Recursos destinados a proyectos sociales e infraestructura para el bienestar de la comunidad." },
            { front: "Plan de Desarrollo Municipal", back: "Hoja de ruta de 4 años que justifica cada inversión incluida en el presupuesto." },
            { front: "Equilibrio Presupuestal", back: "Principio legal: El total de los ingresos (1) debe ser igual a la suma de los gastos (2) y la deuda (3)." },
            { front: "IPC (Inflación)", back: "Variable macroeconómica usada para ajustar el valor del presupuesto anual y mantener el poder adquisitivo." },
            { front: "Fuente ICLD (1.2.1.0.00)", back: "Bolsillo de recursos propios. Es el único que permite financiar la nómina administrativa general." },
            { front: "Uso del SGP Educación", back: "Financiar el servicio educativo, pago de docentes y mantenimiento de colegios públicos." },
            { front: "Uso de las Estampillas", back: "Financiar sectores específicos con 'etiqueta' social como Cultura (Pro-Cultura) o Adulto Mayor." },
            { front: "Concepto de TASAS", back: "Pagos recibidos por un servicio prestado (ej. Tasa Pro-Deporte) destinados a fomentar dicha actividad." },
            { front: "Recursos de Capital", back: "Ingresos extraordinarios como créditos, rendimientos financieros o venta de activos estatales." },
            { front: "Apropiación", back: "Autorización máxima legal que otorga el Concejo para gastar en un rubro específico durante la vigencia." },
            { front: "Vigencia Fiscal", back: "Año presupuestal: Inicia siempre el 1 de enero y termina el 31 de diciembre." },
            { front: "Estatuto Orgánico", back: "La norma superior que dicta cómo se programa, aprueba y ejecuta el presupuesto público." },
            { front: "POAI", back: "Plan Operativo Anual de Inversiones: Conecta los proyectos sociales con el dinero disponible." },
            { front: "MFMP", back: "Marco Fiscal de Mediano Plazo: Proyecciones a 10 años para garantizar la sostenibilidad fiscal." },
            { front: "Sobretasa a la Gasolina", back: "Fuente con destino fijo por ley exclusivamente para vías y sistemas de transporte." },
            { front: "Pasivos Prestacionales", back: "Reserva obligatoria para cubrir el pago de pensiones y cesantías de los funcionarios." },
            { front: "Cadena Presupuestal", back: "Pasos operativos del gasto: 1. Solicitud de CDP -> 2. Expedición de CDP -> 3. Registro Presupuestal (RP) -> 4. Obligación (OBL) -> 5. Orden de Pago (OP)." },
            { front: "Diferencia Rubro vs Fuente", back: "El Rubro es el NOMBRE del dinero (Predial); la Fuente es el PERMISO de uso legal (ICLD)." },
            { front: "Uso de la Cuenta 3 (Deuda)", back: "Destinada exclusivamente para honrar obligaciones financieras (capital e intereses) contraídas anteriormente." },
            { front: "Ciclo Presupuestal (3 Pasos)", back: "1. Planeación (Proyección y aprobación) -> 2. Ejecución (Recaudo y gasto) -> 3. Cierre (Evaluación y liquidación definitiva)." },
            { front: "CDP vs RP", back: "El CDP garantiza que hay disponibilidad de saldo; el RP perfecciona el compromiso legal (ej. firma de contrato)." }
        ];

        let currentIndex = 0;
        const totalCards = flashcardsData.length;
        const cardWrapper = document.getElementById('card-wrapper');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const flipBtn = document.getElementById('flip-btn');

        const pastelClasses = ['bg-pastel-1', 'bg-pastel-2', 'bg-pastel-3', 'bg-pastel-4', 'bg-pastel-5'];

        function renderCard() {
            const card = flashcardsData[currentIndex];
            const pastelClass = pastelClasses[currentIndex % pastelClasses.length];
            
            cardWrapper.innerHTML = `
                <div class="flashcard-inner w-full h-full animate-slide" id="current-card">
                    <div class="flashcard-front ${pastelClass}">
                        <h3 class="text-xs uppercase font-bold opacity-60 mb-4 tracking-tighter">Pregunta de Estudio</h3>
                        <p class="text-center font-bold px-4">${card.front}</p>
                    </div>
                    <div class="flashcard-back">
                        <h3 class="text-xs uppercase font-bold text-gray-400 mb-4 tracking-tighter">Respuesta Técnica</h3>
                        <p class="text-gray-800 text-center font-medium">${card.back}</p>
                    </div>
                </div>
            `;

            // Event listener para voltear por clic directo
            document.getElementById('current-card').addEventListener('click', flipCard);

            // Actualizar UI
            progressText.innerText = `Tarjeta ${currentIndex + 1} de ${totalCards}`;
            progressBar.style.width = `${((currentIndex + 1) / totalCards) * 100}%`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === totalCards - 1;
            
            // Reset botón de flip
            flipBtn.innerText = "Ver Respuesta";
        }

        function flipCard() {
            const inner = document.getElementById('current-card');
            inner.classList.toggle('is-flipped');
            flipBtn.innerText = inner.classList.contains('is-flipped') ? "Volver a Pregunta" : "Ver Respuesta";
        }

        function nextCard() {
            if (currentIndex < totalCards - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        // Event Listeners
        nextBtn.addEventListener('click', nextCard);
        prevBtn.addEventListener('click', prevCard);
        flipBtn.addEventListener('click', flipCard);

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") nextCard();
            if (e.key === "ArrowLeft") prevCard();
            if (e.key === " ") { e.preventDefault(); flipCard(); }
        });

        // Inicio
        renderCard();
    </script>
</body>
</html>
